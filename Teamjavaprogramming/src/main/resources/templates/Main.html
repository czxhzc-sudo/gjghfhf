<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>우주공강</title>
    <link rel="stylesheet" th:href="@{/main.css}">
</head>

<body>

<!-- 상단 -->
<header class="top-header">

    <div class="logo-area">
        <div class="logo">우주공강</div>
        <div class="logo-sub">비는 시간도, 좋은 만남이 된다</div>
    </div>

    <div class="top-buttons">

        <button class="icon-button"
                onclick="location.href='/search'">
            🔍
        </button>

        <button class="mypage-button"
                onclick="location.href='/mypage'">

            <span>👤</span>
            <span th:text="${member.stdName}">닉네임</span>

        </button>

        <button class="logout-button"
                onclick="location.href='/member/logout'">
            로그아웃
        </button>

    </div>

</header>


<!-- 오늘의 시간표 -->
<section class="today-timetable">

    <div class="section-title">
        오늘의 시간표
    </div>

    <div class="timetable-row" id="todayTimetable">
        <!-- JavaScript가 현재 요일의 시간표를 만들어 줌 -->
    </div>

</section>
<!-- 카테고리 -->
<nav class="category-menu">

    <button type="button" onclick="showRecommendation()">
        추천
    </button>

    <button type="button" onclick="showAllPosts()">
        전체
    </button>

    <button type="button" onclick="showPosts('학습'); showStudyMenu()">
        학습
    </button>

    <button type="button" onclick="showPosts('운동'); showSportsMenu()">
        운동
    </button>

    <button type="button" onclick="showPosts('동아리'); showClubMenu()">
        동아리
    </button>

    <button type="button" onclick="showPosts('취미'); showHobbyMenu()">
        취미
    </button>

    <button type="button" id="matchingButton" onclick="openMatchingModal()">
        빠른 매칭
    </button>

</nav>

<!-- 추천 하위 메뉴 -->
<div class="sports-sub-menu" id="recommendMenu">

    <div class="sports-buttons" id="recommendButtons">
        <!-- JavaScript가 회원의 관심 콘텐츠를 넣어줌 -->
    </div>

    <button type="button"
            class="hide-button"
            onclick="hideRecommendMenu()">
        숨김
    </button>

</div>
<!-- 운동 하위 메뉴 -->
<div class="sports-sub-menu" id="sportsMenu">

    <div class="sports-buttons">

        <button type="button" onclick="showPosts('운동', '헬스')">
            헬스
        </button>

        <button type="button" onclick="showPosts('운동', '러닝')">
            러닝
        </button>

        <button type="button" onclick="showPosts('운동', '농구')">
            농구
        </button>

        <button type="button" onclick="showPosts('운동', '축구')">
            축구
        </button>

        <button type="button" onclick="showPosts('운동', '등산')">
            등산
        </button>

    </div>

    <button type="button"
            class="hide-button"
            onclick="hideSportsMenu()">
        숨김
    </button>

</div>
<!-- 학습 하위 메뉴 -->
<div class="sports-sub-menu" id="studyMenu">

    <div class="sports-buttons">

        <button type="button" onclick="showPosts('학습', '시험')">
            시험
        </button>

        <button type="button" onclick="showPosts('학습', '전공공부')">
            전공공부
        </button>

        <button type="button" onclick="showPosts('학습', '프로젝트')">
            프로젝트
        </button>

        <button type="button" onclick="showPosts('학습', '자격증')">
            자격증
        </button>

        <button type="button" onclick="showPosts('학습', '어학')">
            어학
        </button>

    </div>

    <button type="button"
            class="hide-button"
            onclick="hideStudyMenu()">
        숨김
    </button>
</div>
<!-- 동아리 하위 메뉴 -->
<div class="sports-sub-menu" id="clubMenu">

    <div class="sports-buttons">

        <button type="button" onclick="showPosts('동아리', '전공')">
            전공
        </button>

        <button type="button" onclick="showPosts('동아리', '봉사')">
            봉사
        </button>

        <button type="button" onclick="showPosts('동아리', '친목')">
            친목
        </button>

        <button type="button" onclick="showPosts('동아리', '공연')">
            공연
        </button>

        <button type="button" onclick="showPosts('동아리', '학술')">
            학술
        </button>

    </div>

    <button type="button"
            class="hide-button"
            onclick="hideClubMenu()">
        숨김
    </button>

</div>
<!-- 취미 하위 메뉴 -->
<div class="sports-sub-menu" id="hobbyMenu">

    <div class="sports-buttons">

        <button type="button" onclick="showPosts('취미', '게임')">
            게임
        </button>

        <button type="button" onclick="showPosts('취미', '영화')">
            영화
        </button>

        <button type="button" onclick="showPosts('취미', '식사')">
            식사
        </button>

        <button type="button" onclick="showPosts('취미', '카페')">
            카페
        </button>

        <button type="button" onclick="showPosts('취미', '공연')">
            공연
        </button>

    </div>

    <button type="button"
            class="hide-button"
            onclick="hideHobbyMenu()">
        숨김
    </button>

</div>
<!-- 게시글 -->
<main class="post-section">

    <div class="post-header">
        <h2>게시글</h2>

        <button class="write-button"
                onclick="location.href='/post/create'">
            글쓰기
        </button>
    </div>
    <!--게시글 나오는 형식-->
    <div class="post-list">

        <div class="post-card"
             th:each="post : ${posts}"
             th:attr="data-id=${post.id},
                  data-category=${post.category},
                  data-hashtags=${#strings.listJoin(post.hashtags, ',')}">

            <!-- 제목 -->
            <div class="post-title">
                제목:
                <span th:text="${post.title}"></span>
            </div>

            <!-- 작성자 -->
            <div class="post-author">
                작성자:
                <span th:text="${post.author}"></span>
            </div>

            <!-- 시간 -->
            <div class="post-time">
                시간:
                <span th:text="${post.startTime}"></span>
                ~
                <span th:text="${post.endTime}"></span>
            </div>

            <!-- 내용 -->
            <div class="post-content">
                내용:
                <span th:text="${post.content}"></span>
            </div>

            <!-- 콘텐츠 -->
            <div class="post-tags">
                콘텐츠:
                <span th:each="tag : ${post.hashtags}">
                #<span th:text="${tag}"></span>
            </span>
            </div>

            <!-- 모집 정보 -->
            <div class="post-recruit">

                <!-- 무관 -->
                <span th:if="${post.recruitType == '무관'}">
                남녀: 무관
                &nbsp;&nbsp;
                모집:
                <span th:text="${post.currentMembers}"></span>
                /
                <span th:text="${post.maxMembers}"></span>
                명
            </span>

                <!-- 성별별 -->
                <span th:if="${post.recruitType == '성별별'}">
                남:
                <span th:text="${post.maleCurrentMembers}"></span>
                /
                <span th:text="${post.maleMaxMembers}"></span>

                &nbsp;&nbsp;

                여:
                <span th:text="${post.femaleCurrentMembers}"></span>
                /
                <span th:text="${post.femaleMaxMembers}"></span>

                &nbsp;&nbsp;

                모집:
                <span th:text="${post.currentMembers}"></span>
                /
                <span th:text="${post.maxMembers}"></span>
                명
            </span>
            </div>
            <!-- 모집 전공 -->
            <div>
                모집 전공: <span th:text="${post.recruitMajor}"></span>
            </div>
            <!-- 모집 학번 -->
            <div>
                모집 학번:
                <span th:if="${post.recruitStartYear == null or post.recruitEndYear == null}">
                        무관
                </span>
                <span th:if="${post.recruitStartYear != null and post.recruitEndYear != null}">
                    <span th:text="${post.recruitStartYear}"></span>
                    ~
                    <span th:text="${post.recruitEndYear}"></span>학번
                </span>
            </div>
            <!-- 요일 -->
            <div class="post-day">
                요일:
                <span th:text="${post.meetingDay}"></span>
            </div>

            <!-- 가입하기 -->
            <div class="post-button-area">
                <button type="button"
                        class="join-button"
                        th:if="${post.author != member.stdName}"
                        th:onclick="'joinPost(' + ${post.id} + ')'">
                    가입하기
                </button>
            </div>

        </div>

    </div>
</main>


<!-- 하단 메뉴 -->
<footer class="bottom-menu">

    <button onclick="location.href='/main'">
        <span>📝</span>
        <span>게시글</span>
    </button>

    <button onclick="location.href='/my-group'">
        <span>👥</span>
        <span>내 모임</span>
    </button>

    <button onclick="location.href='/mypage'">
        <span>👤</span>
        <span>마이페이지</span>
    </button>

    <button onclick="location.href='/timetable'">
        <span>📅</span>
        <span>시간표</span>
    </button>

</footer>

<script th:inline="javascript">
    const memberContents =
        /*[[${stdCon}]]*/ "";

    const recommendedContents =
        memberContents
            ? memberContents.split(",")
            : [];
    function hideAllSubMenus() {
        document.getElementById("recommendMenu").style.display = "none";
        document.getElementById("studyMenu").style.display = "none";
        document.getElementById("sportsMenu").style.display = "none";
        document.getElementById("clubMenu").style.display = "none";
        document.getElementById("hobbyMenu").style.display = "none";
    }
    function showRecommendation() {
        hideAllSubMenus();
        document.getElementById("recommendMenu").style.display = "flex";
        // 추천을 처음 눌렀을 때는
        // 내가 선택한 콘텐츠에 해당하는 게시글을 전부 보여줌
        showRecommendedPosts();
    }
    function hideRecommendMenu() {
        document.getElementById("recommendMenu").style.display = "none";
    }
    function showSportsMenu() {
        hideAllSubMenus();
        document.getElementById("sportsMenu").style.display = "flex";
    }

    function hideSportsMenu() {
        document.getElementById("sportsMenu").style.display = "none";
    }

    function showStudyMenu() {
        hideAllSubMenus();
        document.getElementById("studyMenu").style.display = "flex";
    }

    function hideStudyMenu() {
        document.getElementById("studyMenu").style.display = "none";
    }

    function showClubMenu() {
        hideAllSubMenus();
        document.getElementById("clubMenu").style.display = "flex";
    }

    function hideClubMenu() {
        document.getElementById("clubMenu").style.display = "none";
    }

    function showHobbyMenu() {
        hideAllSubMenus();
        document.getElementById("hobbyMenu").style.display = "flex";
    }

    function hideHobbyMenu() {
        document.getElementById("hobbyMenu").style.display = "none";
    }
    // 빠른 매칭 모달 열기
    function openMatchingModal() {
        document.getElementById("matchingModal").style.display = "flex";
    }

    // 빠른 매칭 모달 닫기
    function closeMatchingModal() {
        document.getElementById("matchingModal").style.display = "none";
    }
    //추천버튼 함수
    function createRecommendationMenu() {

        const container =
            document.getElementById("recommendButtons");

        container.innerHTML = "";

        recommendedContents.forEach(function(content) {

            const button =
                document.createElement("button");

            button.type = "button";
            button.textContent = content;

            button.onclick = function() {
                showRecommendedPosts(content);
            };

            container.appendChild(button);
        });
    }
    //전체 함수
    function showAllPosts() {

        hideAllSubMenus();

        const posts =
            document.querySelectorAll(".post-card");

        posts.forEach(function(post) {
            post.style.display = "block";
        });
    }
    function showRecommendedPosts(selectedContent) {
        const posts =
            document.querySelectorAll(".post-card");
        posts.forEach(function(post) {
            const postHashtags =
                post.dataset.hashtags;
            if (!postHashtags) {
                post.style.display = "none";
                return;
            }
            const postTags =
                postHashtags.split(",");

            // 추천 버튼을 처음 눌렀을 때
            // 회원이 선택한 콘텐츠 중 하나라도 포함된 게시글
            if (selectedContent === undefined) {
                const isRecommended =
                    recommendedContents.some(function(content) {
                        return postTags.includes(content);
                    });

                if (isRecommended) {
                    post.style.display = "block";
                } else {
                    post.style.display = "none";
                }
            }
            // 추천 하위 메뉴에서 특정 콘텐츠를 눌렀을 때
            else {
                if (postTags.includes(selectedContent)) {
                    post.style.display = "block";
                } else {
                    post.style.display = "none";
                }
            }

        });
    }
    function showPosts(category, hashtag) {

        const posts =
            document.querySelectorAll(".post-card");

        posts.forEach(function(post) {
            const postCategory =
                post.dataset.category;
            const postHashtags =
                post.dataset.hashtags;
            // 추천
            if (category === "전체") {
                post.style.display = "block";
            }

            // 카테고리만 선택
            else if (hashtag === undefined) {
                if (postCategory === category) {
                    post.style.display = "block";
                } else {
                    post.style.display = "none";
                }
            }
            // 카테고리 + 세부 콘텐츠 선택
            else {
                if (postCategory === category &&
                    postHashtags &&
                    postHashtags.split(",").includes(hashtag)) {
                    post.style.display = "block";

                } else {

                    post.style.display = "none";
                }
            }
        });

    }


    // 회원의 시간표
    const memberTime =
        /*[[${member.stdTime}]]*/ "";

    const dayList =
        ["일", "월", "화", "수", "목", "금", "토"];

    const today =
        dayList[new Date().getDay()];

    const timetable =
        document.getElementById("todayTimetable");


    for (let period = 1; period <= 9; period++) {

        const cell =
            document.createElement("div");

        cell.classList.add("timetable-cell");

        const value =
            today + period;

        if (memberTime &&
            memberTime.split(",").includes(value)) {

            cell.classList.add("class-time");
            cell.textContent = period + "교시";

        } else {
            cell.classList.add("free-time");
            cell.textContent = period + "교시";
        }
        timetable.appendChild(cell);
    }
    // 게시글 가입 요청
    function joinPost(postId) {

        fetch("/post/" + postId + "/join", {
            method: "POST"
        })
            .then(response => response.text())
            .then(message => {
                alert(message);
                // 가입 성공했으면 메인 화면 새로고침
                if (message === "가입되었습니다.") {
                    location.reload();
                }
            })
            .catch(error => {
                console.error(error);
                alert("오류가 발생했습니다.");
            });
    }
    createRecommendationMenu();
    let matchingStatusTimer = null;
    function startMatching() {

        const targetGender =
            document.getElementById("targetGender").value;

        const selectedMajors =
            [...document.querySelectorAll(
                'input[name="matchingMajor"]:checked'
            )].map(input => input.value);

        const targetMajor =
            selectedMajors.length > 0
                ? selectedMajors.join(",")
                : "무관";

        const minStudentYear =
            document.getElementById("minStudentYear").value;

        const maxStudentYear =
            document.getElementById("maxStudentYear").value;

        const selectedContents =
            [...document.querySelectorAll(
                'input[name="matchingContent"]:checked'
            )].map(input => input.value);

        const targetContents =
            selectedContents.length > 0
                ? selectedContents.join(",")
                : "";

        const params = new URLSearchParams();

        params.append("targetGender", targetGender);
        params.append("targetMajor", targetMajor);

        if (minStudentYear !== "") {
            params.append("minStudentYear", minStudentYear);
        }

        if (maxStudentYear !== "") {
            params.append("maxStudentYear", maxStudentYear);
        }

        if (targetContents !== "") {
            params.append("targetContents", targetContents);
        }


        fetch("/matching/start", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: params.toString()
        })
            .then(response => {

                if (!response.ok) {
                    throw new Error("매칭 시작에 실패했습니다.");
                }
                return response.json();
            })
            .then(data => {

                console.log("매칭 요청:", data);

                closeMatchingModal();

                // 이미 바로 매칭된 경우
                if (data.status === "MATCHED") {

                    document.getElementById("matchingButton").textContent =
                        "빠른 매칭";
                    alert("🎉 매칭이 완료되었습니다!");
                    return;
                }

                // 아직 매칭을 기다리는 경우
                document.getElementById("matchingButton").textContent =
                    "매칭중";

                alert("매칭을 시작했습니다.");
                startMatchingStatusCheck();
            })
            .catch(error => {

                console.error(error);
                alert("매칭 시작 중 오류가 발생했습니다.");
            });
    }
    function startMatchingStatusCheck() {
        // 기존 타이머가 있다면 제거
        if (matchingStatusTimer) {
            clearInterval(matchingStatusTimer);
        }
        matchingStatusTimer = setInterval(() => {
            fetch("/matching/status")
                .then(response => {
                    if (!response.ok) {
                        throw new Error("매칭 상태 확인 실패");
                    }
                    return response.json();
                })
                .then(data => {
                    console.log("현재 매칭 상태:", data.status);
                    // 매칭 성공
                    if (data.status === "MATCHED") {
                        clearInterval(matchingStatusTimer);
                        matchingStatusTimer = null;
                        document.getElementById("matchingButton").textContent =
                            "빠른 매칭";
                        alert("🎉 매칭이 완료되었습니다!");
                    }
                })
                .catch(error => {
                    console.error("매칭 상태 확인 오류:", error);
                });
        }, 2000);
    }
</script>
<!-- 빠른 매칭 모달 -->
<div id="matchingModal" class="matching-modal">
    <div class="matching-modal-content">
        <div class="matching-modal-header">
            <h2>빠른 매칭</h2>
            <button type="button"
                    class="matching-close-button"
                    onclick="closeMatchingModal()">
                ×
            </button>
        </div>

        <div class="matching-modal-body">
            <p>원하는 매칭 조건을 선택해주세요.</p>
            <!-- 매칭 방식 -->
            <div class="matching-option">

                <label>매칭 방식</label>

                <div class="matching-radio">
                    <label>
                        <input type="radio"
                               name="matchingType"
                               value="1"
                               checked>
                        1대1
                    </label>
                </div>

            </div>

            <!-- 성별 -->
            <div class="matching-option">

                <label for="targetGender">
                    성별
                </label>

                <select id="targetGender">

                    <option value="무관">
                        무관
                    </option>

                    <option value="남성">
                        남성
                    </option>

                    <option value="여성">
                        여성
                    </option>

                </select>

            </div>

            <!-- 전공 -->
            <div class="matching-option">

                <label>
                    전공
                </label>

                <div class="matching-majors">

                    <label>
                        <input type="checkbox"
                               name="matchingMajor"
                               value="컴퓨터공학부">
                        컴퓨터공학부
                    </label>
                    <label>
                        <input type="checkbox"
                               name="matchingMajor"
                               value="물리치료학부">
                        물리치료학부
                    </label>

                    <label>
                        <input type="checkbox"
                               name="matchingMajor"
                               value="첨단IT학부">
                        첨단IT학부
                    </label>

                </div>

                <small>
                    선택하지 않으면 무관
                </small>

            </div>

            <!-- 학번 -->
            <div class="matching-option">

                <label>
                    학번
                </label>
                <div class="student-year">
                    <input type="number"
                           id="minStudentYear"
                           placeholder="최소"
                           min="2000"
                           max="2100">

                    <span>~</span>
                    <input type="number"
                           id="maxStudentYear"
                           placeholder="최대"
                           min="2000"
                           max="2100">

                </div>
                <small>
                    비워두면 무관
                </small>
            </div>

            <!-- 주요 콘텐츠 -->
            <div class="matching-option">

                <label>
                    주요 콘텐츠
                </label>

                <div class="matching-contents">

                    <label>
                        <input type="checkbox"
                               name="matchingContent"
                               value="운동">
                        운동
                    </label>

                    <label>
                        <input type="checkbox"
                               name="matchingContent"
                               value="학습">
                        학습
                    </label>

                    <label>
                        <input type="checkbox"
                               name="matchingContent"
                               value="동아리">
                        동아리
                    </label>

                    <label>
                        <input type="checkbox"
                               name="matchingContent"
                               value="취미">
                        취미
                    </label>
                </div>
                <small>
                    선택하지 않으면 무관
                </small>
            </div>
        </div>

        <div class="matching-modal-footer">
            <button type="button"
                    onclick="closeMatchingModal()">
                닫기
            </button>
            <button type="button" onclick="startMatching()">

        </div>
    </div>
</div>
