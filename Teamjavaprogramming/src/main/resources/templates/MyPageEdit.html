<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>회원정보 수정</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            width: 500px;
            margin: 50px auto;
        }

        h1 {
            margin-bottom: 30px;
        }

        .edit-card {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 30px;
        }

        .info-row {
            margin-bottom: 20px;
        }

        .info-title {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            height: 40px;

            border: 1px solid #ccc;
            border-radius: 6px;

            padding: 0 10px;

            font-size: 14px;
        }

        .button-area {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            height: 45px;

            border: 1px solid #ddd;
            border-radius: 8px;

            background-color: white;

            cursor: pointer;
            font-size: 15px;
        }
        button:hover {
            background-color: #eeeeee;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>회원정보 수정</h1>

    <div class="edit-card">
        <form action="/mypage/edit"
              method="post">
            <!-- 아이디 -->
            <div class="info-row">

                <label class="info-title">
                    아이디
                </label>
                <input type="text"
                       th:value="${member.userName}"
                       disabled>

            </div>

            <!-- 닉네임 -->
            <div class="info-row">

                <label class="info-title"
                       for="stdName">
                    닉네임
                </label>
                <input type="text"
                       id="stdName"
                       name="stdName"
                       th:value="${member.stdName}"
                       required>
            </div>

            <!-- 학교 -->
            <div class="info-row">

                <label class="info-title">
                    학교
                </label>

                <input type="text"
                       th:value="${member.stdSchool}"
                       disabled>
            </div>

            <!-- 성별 -->
            <div class="info-row">
                <label class="info-title"
                       for="stdGender">
                    성별
                </label>
                <select id="stdGender"
                        name="stdGender">
                    <option value="남"
                            th:selected="${member.stdGender == '남'}">
                        남
                    </option>
                    <option value="여"
                            th:selected="${member.stdGender == '여'}">
                        여
                    </option>
                </select>

            </div>

            <!-- 생년월일 -->
            <div class="info-row">
                <label class="info-title"
                       for="stdBirth">
                    생년월일
                </label>

                <input type="date"
                       id="stdBirth"
                       name="stdBirth"
                       th:value="${member.stdBirth}">
            </div>

            <!-- 버튼 -->
            <div class="button-area">
                <button type="button"
                        onclick="location.href='/mypage'">
                    취소
                </button>

                <button type="submit">
                    저장
                </button>
            </div>

        </form>

    </div>
</div>

</body>
</html>
