<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>내 모임</title>

    <link rel="stylesheet" th:href="@{/MyGroup.css}">
</head>

<body>

<div class="chat-container"
     th:attr="data-username=${session.userName}">

    <!-- 왼쪽 : 내 모임 목록 -->
    <div class="group-sidebar">

        <div class="sidebar-header">
            <h2>내 모임</h2>
        </div>

        <div class="group-list">

            <div class="group-card"
                 th:each="group : ${myGroups}"
                 th:attr="data-room-id=${group.id}"
                 onclick="selectRoom(this)">

                <div class="group-name"
                     th:text="${group.roomName}">
                    모임 이름
                </div>

                <div class="group-date"
                     th:text="${#temporals.format(group.createdAt, 'yyyy-MM-dd HH:mm')}">
                    생성 시간
                </div>

            </div>

            <div class="empty"
                 th:if="${myGroups.isEmpty()}">

                아직 가입한 모임이 없습니다.

            </div>

        </div>

        <button class="back-button"
                onclick="location.href='/main'">
            메인으로 돌아가기
        </button>

    </div>


    <!-- 오른쪽 : 채팅방 -->
    <div class="chat-area">

        <div class="chat-header">
            <h2 id="chat-room-name">
                모임을 선택해주세요
            </h2>
        </div>

        <div class="chat-messages" id="chat-messages">

            <div class="welcome-message">
                왼쪽에서 모임을 선택하면<br>
                채팅방이 나타납니다.
            </div>

        </div>

        <div class="chat-input-area">

            <input type="text"
                   id="message-input"
                   placeholder="메시지를 입력하세요."
                   disabled>

            <button id="send-button"
                    disabled>
                전송
            </button>

        </div>

    </div>

</div>

<script>

    // 현재 선택한 채팅방 ID
    let currentRoomId = null;
    let messageTimer = null;

    // 현재 로그인한 사용자 이름
    const username =
        document.querySelector(".chat-container")
            .dataset.username;


    // 채팅방 선택
    function selectRoom(element) {

        // 선택한 방의 ID 가져오기
        currentRoomId =
            element.getAttribute("data-room-id");

        // 선택한 방의 이름 가져오기
        const roomName =
            element.querySelector(".group-name").textContent;

        // 방 이름을 오른쪽 상단에 표시
        document.getElementById("chat-room-name")
            .textContent = roomName;

        // 메시지 입력창 활성화
        document.getElementById("message-input")
            .disabled = false;

        // 전송 버튼 활성화
        document.getElementById("send-button")
            .disabled = false;

        // 선택된 모임 표시
        document.querySelectorAll(".group-card")
            .forEach(card => {
                card.classList.remove("selected");
            });

        element.classList.add("selected");

        // 해당 채팅방의 메시지 가져오기
        loadMessages(currentRoomId);
        startMessageRefresh();
    }
    function startMessageRefresh() {

        // 기존 타이머가 있다면 제거
        if (messageTimer !== null) {
            clearInterval(messageTimer);
        }

        // 3초마다 메시지 확인
        messageTimer = setInterval(function () {

            if (currentRoomId !== null) {
                loadMessages(currentRoomId);
            }

        }, 3000);
    }

    // 채팅방의 메시지 가져오기

    function loadMessages(roomId) {

        fetch("/chat/" + roomId + "/messages")
            .then(response => response.json())
            .then(messages => {

                const chatMessages =
                    document.getElementById("chat-messages");

                chatMessages.innerHTML = "";

                messages.forEach(message => {

                    // 메시지 전체를 감싸는 div
                    const messageDiv =
                        document.createElement("div");

                    messageDiv.classList.add("message");

                    // 내 메시지인지 다른 사람 메시지인지 확인
                    if (message.username === username) {
                        messageDiv.classList.add("my-message");
                    }
                    else {
                        messageDiv.classList.add("other-message");
                    }

                    // 사용자 이름
                    const nameDiv =
                        document.createElement("div");
                    nameDiv.classList.add("message-name");

                    nameDiv.textContent =
                        message.senderName;

                    // 메시지 내용
                    const textDiv =
                        document.createElement("div");

                    textDiv.classList.add("message-text");
                    textDiv.textContent =
                        message.message;
                    // 이름 + 메시지 추가
                    messageDiv.appendChild(nameDiv);
                    messageDiv.appendChild(textDiv);
                    chatMessages.appendChild(messageDiv);
                });

                // 가장 아래 메시지로 이동
                chatMessages.scrollTop =
                    chatMessages.scrollHeight;
            })
            .catch(error => {

                console.error(
                    "메시지 불러오기 실패:",
                    error
                );
            });
    }

    // 메시지 보내기
    // 메시지 보내기
    function sendMessage() {

        if (currentRoomId === null) {
            return;
        }

        const input =
            document.getElementById("message-input");

        const message =
            input.value.trim();

        if (message === "") {
            return;
        }

        const params = new URLSearchParams();
        params.append("message", message);

        fetch("/chat/" + currentRoomId + "/messages", {

            method: "POST",
            headers: {
                "Content-Type":
                    "application/x-www-form-urlencoded"
            },
            body: params
        })
            .then(response => response.json())
            .then(savedMessage => {

                // 입력창 비우기
                input.value = "";

                // 메시지를 다시 불러오기
                loadMessages(currentRoomId);

            })
            .catch(error => {
                console.error(
                    "메시지 전송 실패:",
                    error
                );
            });
    }



    // 전송 버튼 클릭
    document.getElementById("send-button")
        .addEventListener("click", sendMessage);


    // Enter 키로 메시지 보내기
    document.getElementById("message-input")
        .addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                sendMessage();
            }

        });

</script>

</body>
</html>
